<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>NuCalorie</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <p class="eyebrow" id="greet">NuCalorie</p>
          <h1 id="coachLine">Today's plan</h1>
        </div>
        <button class="lang" id="langBtn" type="button">EN</button>
      </header>

      <section class="ring-card">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" class="track" />
            <circle cx="60" cy="60" r="50" class="progress" id="ring" />
          </svg>
          <div class="ring-label">
            <strong id="eaten">0</strong>
            <span id="kcalLabel">kcal</span>
          </div>
        </div>
        <div class="stats">
          <div><span id="targetLbl">Target</span><b id="target">—</b></div>
          <div><span id="leftLbl">Left</span><b id="left">—</b></div>
          <div><span id="pointsLbl">Points</span><b id="points">0</b></div>
        </div>
      </section>

      <nav class="tabs">
        <button class="tab on" data-tab="home" type="button">Home</button>
        <button class="tab" data-tab="log" type="button">Log</button>
        <button class="tab" data-tab="plan" type="button">Plan</button>
        <button class="tab" data-tab="profile" type="button">Profile</button>
      </nav>

      <main id="home" class="panel on">
        <h2 id="mealsTitle">Meals</h2>
        <div id="meals" class="list"></div>
        <h2 id="woTitle">Workout</h2>
        <div id="workout" class="list"></div>
        <h2 id="chTitle">Challenges</h2>
        <div id="challenges" class="list"></div>
        <button class="ghost" id="starsBtn" type="button">Unlock deep report · 50 Stars</button>
      </main>

      <main id="log" class="panel">
        <form id="logForm" class="card">
          <label><span id="foodLbl">Food</span><input name="name" required placeholder="Oatmeal" /></label>
          <label><span>kcal</span><input name="kcal" type="number" min="1" required placeholder="250" /></label>
          <button type="submit" id="logSubmit">Add</button>
        </form>
        <div id="todayLog" class="list"></div>
      </main>

      <main id="plan" class="panel">
        <p class="coach" id="coach"></p>
        <div class="macros" id="macros"></div>
        <h2 id="trackTitle">Fitness trackers (top-3)</h2>
        <div class="trackers">
          <button type="button" data-tr="appleHealth">Apple Health</button>
          <button type="button" data-tr="googleFit">Google Fit</button>
          <button type="button" data-tr="strava">Strava</button>
        </div>
      </main>

      <main id="profile" class="panel">
        <form id="profileForm" class="card">
          <label><span id="ageLbl">Age</span><input name="age" type="number" min="14" max="80" /></label>
          <label>
            <span id="sexLbl">Sex</span>
            <select name="sex">
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </label>
          <label><span id="hLbl">Height cm</span><input name="heightCm" type="number" /></label>
          <label><span id="wLbl">Weight kg</span><input name="weightKg" type="number" step="0.1" /></label>
          <label>
            <span id="goalLbl">Goal</span>
            <select name="goal">
              <option value="lose">Lose</option>
              <option value="maintain">Maintain</option>
              <option value="gain">Gain</option>
            </select>
          </label>
          <label>
            <span id="actLbl">Activity</span>
            <select name="activity">
              <option value="sedentary">Sedentary</option>
              <option value="light">Light</option>
              <option value="moderate">Moderate</option>
              <option value="active">Active</option>
            </select>
          </label>
          <button type="submit" id="saveBtn">Save profile</button>
        </form>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
